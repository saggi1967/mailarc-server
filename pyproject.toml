[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailarc-server"
version = "2.6.1.0"
description = "Zentrale REST-Gegenstelle (Konten + Mail-Ablage) für den imap-archiver-Client"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "elasticsearch>=9,<10",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
pdf = ["weasyprint>=63"]  # optional: serverseitiges PDF-Rendering (/api/emails/{id}/pdf)
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.routers"]
